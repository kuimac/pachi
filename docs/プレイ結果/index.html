<h1>プレイ結果</h1>
<p class="intro">自分が打った台の収支一覧と累計です。店舗・機種で絞り込めます。初期表示は全店舗・全機種。元データは <code>プレイ履歴.md</code>。</p>
<div class="play-filters" role="group" aria-label="プレイ結果の絞り込み"><label>店舗 <select id="play-filter-store"><option value="all" selected>全店舗</option></select></label><label>機種 <select id="play-filter-machine"><option value="all" selected>全機種</option></select></label></div>
<div id="play-totals" class="stats play-totals"><div class="stat"><span>累計収支</span><b class="play-profit">0円</b></div><div class="stat"><span>累計投資</span><b>0円</b></div><div class="stat"><span>累計換金</span><b>0円</b></div><div class="stat"><span>件数</span><b>0回（収支判明 0 · 勝0 / 負0）</b></div></div>



<p class="intro">収支が入ったプレイはまだありません。<code>プレイ履歴.md</code> に追記するとここに出ます。</p>
<input class="search" id="q" type="search" placeholder="日付、店舗、台番号、機種名" autocomplete="off">
<p id="empty" class="empty" hidden>一致する結果がありません。</p>
<p class="foot">表示を作り直すときは <code>python3 tools/build_html.py</code></p>


</main>

<script>
(() => {
  const parse = (text) => {
    const raw = (text || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw === '—' || raw === '-' || raw === '－') return { n: null, s: '' };
    const cleaned = raw
      .replace(/,/g, '')
      .replace(/[＋]/g, '+')
      .replace(/[−－]/g, '-')
      .replace(/円(\/千円|\/朝)?$/u, '')
      .replace(/%$/u, '')
      .replace(/個$/u, '')
      .replace(/回$/u, '')
      .replace(/G$/iu, '');
    if (/^[+-]?\d+(\.\d+)?$/.test(cleaned)) return { n: Number(cleaned), s: raw };
    return { n: null, s: raw.toLowerCase() };
  };
  const cellText = (td) => (td ? td.innerText || td.textContent || '' : '');
  document.querySelectorAll('table').forEach((table) => {
    const headRow = table.tHead && table.tHead.rows[0];
    const body = table.tBodies[0];
    if (!headRow || !body || body.rows.length < 2) return;
    table.classList.add('sortable');
    [...headRow.cells].forEach((th, col) => {
      if (th.colSpan > 1) return;
      th.tabIndex = 0;
      th.setAttribute('role', 'button');
      th.setAttribute('aria-sort', 'none');
      const activate = () => {
        const asc = th.dataset.sort !== 'asc';
        [...headRow.cells].forEach((cell) => {
          delete cell.dataset.sort;
          cell.setAttribute('aria-sort', 'none');
        });
        th.dataset.sort = asc ? 'asc' : 'desc';
        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
        const rows = [...body.rows].map((row, index) => {
          const value = parse(cellText(row.cells[col]));
          return { row, index, value };
        });
        rows.sort((a, b) => {
          const an = a.value.n;
          const bn = b.value.n;
          let cmp = 0;
          if (an != null && bn != null) cmp = an - bn;
          else if (an != null) cmp = -1;
          else if (bn != null) cmp = 1;
          else cmp = a.value.s.localeCompare(b.value.s, 'ja');
          if (cmp === 0) cmp = a.index - b.index;
          return asc ? cmp : -cmp;
        });
        rows.forEach(({ row }) => body.appendChild(row));
      };
      th.addEventListener('click', activate);
      th.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate();
        }
      });
    });
  });
})();
</script>
