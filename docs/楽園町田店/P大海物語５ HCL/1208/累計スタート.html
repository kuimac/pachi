<script>
(() => {
  const parse = (td) => {
    if (!td) return { n: null, s: '' };
    if (td.dataset && td.dataset.n != null && td.dataset.n !== '') {
      const n = Number(td.dataset.n);
      if (!Number.isNaN(n)) return { n, s: (td.innerText || td.textContent || '').trim() };
    }
    const raw = (td.innerText || td.textContent || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw === '—' || raw === '-' || raw === '－') return { n: null, s: '' };
    const oneOver = raw.match(/1\s*\/\s*(\d+(?:\.\d+)?)/);
    if (oneOver) return { n: Number(oneOver[1]), s: raw };
    const cleaned = raw
      .replace(/,/g, '')
      .replace(/[＋]/g, '+')
      .replace(/[−－]/g, '-')
      .replace(/^約/u, '')
      .replace(/円(\/千円|\/朝)?$/u, '')
      .replace(/%$/u, '')
      .replace(/個$/u, '')
      .replace(/回$/u, '')
      .replace(/G$/iu, '');
    if (/^[+-]?\d+(\.\d+)?$/.test(cleaned)) return { n: Number(cleaned), s: raw };
    return { n: null, s: raw.toLowerCase() };
  };
  document.querySelectorAll('table').forEach((table) => {
    const headRow = table.tHead && table.tHead.rows[0];
    const body = table.tBodies[0];
    if (!headRow || !body || body.rows.length < 2) return;
    table.classList.add('sortable');
    const activators = [];
    [...headRow.cells].forEach((th, col) => {
      if (th.colSpan > 1) return;
      th.tabIndex = 0;
      th.setAttribute('role', 'button');
      th.setAttribute('aria-sort', 'none');
      const activate = (forceAsc) => {
        let asc;
        if (typeof forceAsc === 'boolean') {
          asc = forceAsc;
        } else if (!th.dataset.sort) {
          // 初回: data-sort-pref="desc" なら高い順から
          asc = th.dataset.sortPref !== 'desc';
        } else {
          asc = th.dataset.sort !== 'asc';
        }
        [...headRow.cells].forEach((cell) => {
          delete cell.dataset.sort;
          cell.setAttribute('aria-sort', 'none');
        });
        th.dataset.sort = asc ? 'asc' : 'desc';
        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
        const rows = [...body.rows].map((row, index) => {
          const value = parse(row.cells[col]);
          return { row, index, value };
        });
        rows.sort((a, b) => {
          const an = a.value.n;
          const bn = b.value.n;
          // 数値欠落（空欄）は昇順・降順どちらでも末尾
          if (an == null && bn == null) {
            let cmp = a.value.s.localeCompare(b.value.s, 'ja');
            if (cmp === 0) cmp = a.index - b.index;
            return cmp;
          }
          if (an == null) return 1;
          if (bn == null) return -1;
          let cmp = an - bn;
          if (cmp === 0) cmp = a.index - b.index;
          return asc ? cmp : -cmp;
        });
        rows.forEach(({ row }) => body.appendChild(row));
      };
      th.addEventListener('click', () => activate());
      th.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate();
        }
      });
      activators.push({ th, activate });
    });
    const def = activators.find((x) => x.th.dataset.defaultSort);
    if (def) {
      const wantAsc = def.th.dataset.defaultSort === 'asc';
      def.activate(wantAsc);
    }
  });
})();
</script>
