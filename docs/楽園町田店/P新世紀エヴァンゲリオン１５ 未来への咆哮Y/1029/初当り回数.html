  <p class="kicker">P新世紀エヴァンゲリオン１５ 未来への咆哮Y</p><h1>1029 初当り回数</h1><div class="related"><a href="index.html">この台のまとめ</a></div><div class="charts"><section class="chart"><h3>初当り回数</h3><p>右端が当日。棒にカーソルを合わせると数値が出ます。</p><svg viewBox="0 0 640 196" role="img" aria-label="初当り回数"><line x1="8" y1="168" x2="632" y2="168" stroke="#e4dcd0"/><rect x="8.0" y="147.1" width="118.4" height="20.9" rx="3" fill="#2f5d50"><title>11/6 1</title></rect><text x="67.2" y="143.1" text-anchor="middle" font-size="11" fill="#1e1a16">1</text><text x="67.2" y="188" text-anchor="middle" font-size="11" fill="#6f675e">11/6</text><rect x="134.4" y="22.0" width="118.4" height="146.0" rx="3" fill="#2f5d50"><title>11/7 7</title></rect><text x="193.6" y="18.0" text-anchor="middle" font-size="11" fill="#1e1a16">7</text><text x="193.6" y="188" text-anchor="middle" font-size="11" fill="#6f675e">11/7</text><rect x="260.8" y="63.7" width="118.4" height="104.3" rx="3" fill="#2f5d50"><title>11/8 5</title></rect><text x="320.0" y="59.7" text-anchor="middle" font-size="11" fill="#1e1a16">5</text><text x="320.0" y="188" text-anchor="middle" font-size="11" fill="#6f675e">11/8</text><rect x="387.2" y="147.1" width="118.4" height="20.9" rx="3" fill="#2f5d50"><title>11/9 1</title></rect><text x="446.4" y="143.1" text-anchor="middle" font-size="11" fill="#1e1a16">1</text><text x="446.4" y="188" text-anchor="middle" font-size="11" fill="#6f675e">11/9</text><rect x="513.6" y="168.0" width="118.4" height="0.0" rx="3" fill="#d9d0c4"><title>11/10 —</title></rect><text x="572.8" y="188" text-anchor="middle" font-size="11" fill="#6f675e">11/10</text></svg></section></div><div class="table-wrap"><table class="sheet"><thead><tr><th>日付</th><th>相対日</th><th class="num">初当り回数</th></tr></thead><tbody><tr class=""><td>11/6</td><td>4日前</td><td class="num">1</td></tr><tr class=""><td>11/7</td><td>3日前</td><td class="num">7</td></tr><tr class=""><td>11/8</td><td>2日前</td><td class="num">5</td></tr><tr class=""><td>11/9</td><td>前日</td><td clas <script>
(() => {
  const parse = (text) => {
    const raw = (text || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw === '—' || raw === '-' || raw === '－') return { n: null, s: '' };
    const cleaned = raw
      .replace(/,/g, '')
      .replace(/[＋]/g, '+')
      .replace(/[−－]/g, '-')
      .replace(/円(\/千円|\/朝)?$/u, '')
      .replace(/%$/u, '')
      .replace(/個$/u, '')
      .replace(/回$/u, '')
      .replace(/G$/iu, '');
    if (/^[+-]?\d+(\.\d+)?$/.test(cleaned)) return { n: Number(cleaned), s: raw };
    return { n: null, s: raw.toLowerCase() };
  };
  const cellText = (td) => (td ? td.innerText || td.textContent || '' : '');
  document.querySelectorAll('table').forEach((table) => {
    const headRow = table.tHead && table.tHead.rows[0];
    const body = table.tBodies[0];
    if (!headRow || !body || body.rows.length < 2) return;
    table.classList.add('sortable');
    [...headRow.cells].forEach((th, col) => {
      if (th.colSpan > 1) return;
      th.tabIndex = 0;
      th.setAttribute('role', 'button');
      th.setAttribute('aria-sort', 'none');
      const activate = () => {
        const asc = th.dataset.sort !== 'asc';
        [...headRow.cells].forEach((cell) => {
          delete cell.dataset.sort;
          cell.setAttribute('aria-sort', 'none');
        });
        th.dataset.sort = asc ? 'asc' : 'desc';
        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
        const rows = [...body.rows].map((row, index) => {
          const value = parse(cellText(row.cells[col]));
          return { row, index, value };
        });
        rows.sort((a, b) => {
          const an = a.value.n;
          const bn = b.value.n;
          let cmp = 0;
          if (an != null && bn != null) cmp = an - bn;
          else if (an != null) cmp = -1;
          else if (bn != null) cmp = 1;
          else cmp = a.value.s.localeCompare(b.value.s, 'ja');
          if (cmp === 0) cmp = a.index - b.index;
          return asc ? cmp : -cmp;
        });
        rows.forEach(({ row }) => body.appendChild(row));
      };
      th.addEventListener('click', activate);
      th.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate();
        }
      });
    });
  });
})();
</script>
