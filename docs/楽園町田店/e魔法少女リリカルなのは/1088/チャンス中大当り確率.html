  <p class="kicker">ｅ魔法少女リリカルなのは</p><h1>1088 チャンス中大当り確率</h1><div class="related"><a href="index.html">この台のまとめ</a><a href="../../../%E6%94%BB%E7%95%A5%E6%83%85%E5%A0%B1/e%E9%AD%94%E6%B3%95%E5%B0%91%E5%A5%B3%E3%83%AA%E3%83%AA%E3%82%AB%E3%83%AB%E3%81%AA%E3%81%AE%E3%81%AF.html">攻略</a><a href="../../../%E6%A9%9F%E7%A8%AE%E3%82%B9%E3%83%9A%E3%83%83%E3%82%AF/e%E9%AD%94%E6%B3%95%E5%B0%91%E5%A5%B3%E3%83%AA%E3%83%AA%E3%82%AB%E3%83%AB%E3%81%AA%E3%81%AE%E3%81%AF.html">スペック</a></div><p>確率は分母です。772 なら 1/772 と表示しています。</p><div class="table-wrap"><table class="sheet"><thead><tr><th>日付</th><th>相対日</th><th class="num">チャンス中大当り確率</th></tr></thead><tbody><tr class=""><td>10/30</td><td>7日前</td><td class="num">—</td></tr><tr class=""><td>10/31</td><td>6日前</td><td class="num">1/121</td></tr><tr class=""><td>11/1</td><td>5日前</td><td class="num">1/57</td></tr><tr class=""><td>11/2</td><td>4日前</td><td class="num">1/26</td></tr><tr class=""><td>11/3</td><td>3日前</td><td class="num">—</td></tr><tr class=""><td>11/4</td><td>2日前</td><td class="num">—</td></tr><tr class=""><td>11/5</td><td>前日</td><td class="num">1/76</td></tr><tr class="is-today"><td>11/6</td><td class="today">当日</td><td class="num">—</td></tr></tbody></table></div><p class="foot">元ファイル <code>楽園町田店/ｅ魔法少女リリカルなのは/1088/チャンス中大当り確率.csv</code></p>

<script>
(() => {
  const parse = (text) => {
    const raw = (text || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw === '—' || raw === '-' || raw === '－') return { n: null, s: '' };
    const cleaned = raw
      .replace(/,/g, '')
      .replace(/[＋]/g, '+')
      .replace(/[−－]/g, '-')
      .replace(/円(\/千円|\/朝)?$/u, '')
      .replace(/%$/u, '')
      .replace(/個$/u, '')
      .replace(/回$/u, '')
      .replace(/G$/iu, '');
    if (/^[+-]?\d+(\.\d+)?$/.test(cleaned)) return { n: Number(cleaned), s: raw };
    return { n: null, s: raw.toLowerCase() };
  };
  const cellText = (td) => (td ? td.innerText || td.textContent || '' : '');
  document.querySelectorAll('table').forEach((table) => {
    const headRow = table.tHead && table.tHead.rows[0];
    const body = table.tBodies[0];
    if (!headRow || !body || body.rows.length < 2) return;
    table.classList.add('sortable');
    [...headRow.cells].forEach((th, col) => {
      if (th.colSpan > 1) return;
      th.tabIndex = 0;
      th.setAttribute('role', 'button');
      th.setAttribute('aria-sort', 'none');
      const activate = () => {
        const asc = th.dataset.sort !== 'asc';
        [...headRow.cells].forEach((cell) => {
          delete cell.dataset.sort;
          cell.setAttribute('aria-sort', 'none');
        });
        th.dataset.sort = asc ? 'asc' : 'desc';
        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
        const rows = [...body.rows].map((row, index) => {
          const value = parse(cellText(row.cells[col]));
          return { row, index, value };
        });
        rows.sort((a, b) => {
          const an = a.value.n;
          const bn = b.value.n;
          let cmp = 0;
          if (an != null && bn != null) cmp = an - bn;
          else if (an != null) cmp = -1;
          else if (bn != null) cmp = 1;
          else cmp = a.value.s.localeCompare(b.value.s, 'ja');
          if (cmp === 0) cmp = a.index - b.index;
          return asc ? cmp : -cmp;
        });
        rows.forEach(({ row }) => body.appendChild(row));
      };
      th.addEventListener('click', activate);
      th.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate();
        }
      });
    });
  });
})();
</script>
